<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Trámite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='registrotramite.css') }}" />
</head>
<body>

  <!-- Encabezado superior -->
   <div class="contenedor">
        <h1 class="titulo">Sistema de Solicitud y Atención Ciudadana</h1>
        <a href="http://127.0.0.1:5000/">Cerrar sesion</a>
        <img src="{{ url_for('static', filename='logo1.png') }}" alt="logo del Sistema" class="logo">
    </div>

    <nav>
    <a href="{{ url_for('ver') }}">CIUDADANOS</a>
    <a href="{{ url_for('servicios') }}">SERVICIOS</a>
    <a href="{{ url_for('apoyos') }}">APOYOS</a>
    <a href="{{ url_for('tramites') }}" class = activate>TRÁMITES</a>
  </nav>

  <!-- Contenedor central del formulario -->
  <div class="form-container">
    <h2>Registrar nuevo trámite</h2>

    <form class="tramite-form" method="POST" action="{{ url_for('guardar_tramite') }}">

      <div class="form-left">
        <div class="form-group">
          <label>Nombre del Trámite</label>
          <input type="text" name="nombre" placeholder="Nombre del trámite" required />
        </div>

        <div class="form-group">
          <label>Modalidad</label>
          <select name="modalidad" required>
            <option value="">ej. Presencial.</option>
            <option value="Presencial">Presencial</option>
          </select>
        </div>

        <div class="form-group">
          <label>Documento que se expide</label>
          <select name="documento_expide" required>
            <option value="">-- Selecciona --</option>
            <option value="Constancia">Constancia</option>
            <option value="Certificado">Certificado</option>
          </select>
        </div>

        <label for="vigencia" class="required">Vigencia:</label>
        <input type="date" id="vigencia" name="vigencia" required>
      
      </div>

      <div class="form-right">
        <div class="form-group">
          <label>Tipo de Trámite</label>
          <select name="tipo_tramite" required>
            <option value="">-- Selecciona --</option>
            <option value="Licencia">Licencia</option>
            <option value="Permiso">Permiso</option>
          </select>
        </div>

        <div class="form-group">
          <label>Costo</label>
          <input type="number" step="0.01" name="costo" placeholder="Ej. 120.50" />
        </div>

        <div class="form-group">
          <label>Formato de Pago</label>
          <select name="formato_pago" required>
            <option value="">-- Selecciona --</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Efectivo">Efectivo</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select name="estado" required>
            <option value="">-- Selecciona --</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn save">Guardar</button>
        <a href="{{ url_for('tramites') }}" class="btn cancel">Cancelar</a>
      </div>
    </form>
  </div>

</body>
</html>
