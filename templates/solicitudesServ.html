
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar Servicio - SAC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='nuevo_servicio.css') }}" />
</head>
<body>

  <header>Sistema de Solicitud y Atención Ciudadana</header>

  <nav>
    <a href="{{ url_for('ver') }}">CIUDADANOS</a>
    <a href="{{ url_for('servicios') }}" class="active">SERVICIOS</a>
    <a href="{{ url_for('apoyos') }}">APOYOS</a>
    <a href="{{ url_for('tramites') }}">TRÁMITES</a>
  </nav>

  <div class="container">
    <h2>Solicitar Servicio para: {{ ciudadano.nombre }} {{ ciudadano.apellido_paterno }}</h2>

    <form method="POST" action="{{ url_for('guardar_solicitud_servicio', ciudadano_id=ciudadano.id) }}">

      <div class="form-group" style="display: none;">
        <label>ID del Ciudadano</label>
        <input type="text" name="ciudadano_id" value="{{ ciudadano.id }}" readonly />
      </div>

      <div class="form-group">
        <label>Servicio a solicitar</label>
        <select name="servicio_id" required>
          <option value="">Seleccione un servicio...</option>
          {% for servicio in servicios_disponibles %}
          <option value="{{ servicio.id }}">{{ servicio.nombre_servicio }} - Costo: ${{ servicio.costo }}</option>
          {% endfor %}
        </select>
      </div>
    
      <div class="form-group">
        <label>Estado de la Solicitud</label>
        <select name="estado_solicitud" required>
          <option value="Pendiente">Pendiente</option>
          <option value="En Proceso">En Proceso</option>
          <option value="Completado">Completado</option>
          <option value="Rechazado">Rechazado</option>
        </select>
      </div>

      <div class="form-group">
        <label>Comentarios adicionales</label>
        <textarea name="comentarios" rows="4"></textarea>
      </div>

      <button type="submit" class="submit-btn">Guardar Solicitud</button>
    </form>
  </div>

</body>
</html>
