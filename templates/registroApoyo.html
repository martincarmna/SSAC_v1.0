<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Apoyo - SSAC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='nuevo_servicio.css') }}" />
</head>
<body>

  <header>Sistema de Solicitud y Atención Ciudadana</header>

  <nav>
    <a href="{{ url_for('ver') }}">CIUDADANOS</a>
    <a href="{{ url_for('servicios') }}">SERVICIOS</a>
    <a href="{{ url_for('apoyos') }}" class="active">APOYOS</a>
    <a href="{{ url_for('tramites') }}">TRÁMITES</a>
  </nav>

  <div class="container">
    <h2>Nuevo Apoyo</h2>

    <form method="POST" action="{{ url_for('guardar_apoyo') }}">

      <div class="image-placeholder">
        <img src="https://via.placeholder.com/100?text=+" alt="Imagen del apoyo" />
      </div>

      <div class="form-group">
        <label>ID</label>
        <input type="text" placeholder="ID automático" disabled />
      </div>

      <div class="form-group">
        <label>Nombre del Apoyo</label>
        <input type="text" name="nombre" required />
      </div>

      <div class="form-group">
        <label>Nombre del Encargado</label>
        <input type="text" name="encargado" required />
      </div>

      <div class="form-group">
        <label>Tipo Apoyo</label>
        <select name="tipo_apoyo" required>
          <option value="">Seleccione...</option>
          <option value="tipo1">pollos</option>
          <option value="tipo2">tinacos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Costo</label>
        <div class="cost-input">
          <button type="button" onclick="decrease()">−</button>
          <input type="number" name="costo" id="cost" value="10" min="0" />
          <button type="button" onclick="increase()">+</button>
        </div>
      </div>

      <div class="pdf-links">
        <a href="#"><img src="https://img.icons8.com/ios-filled/50/000000/pdf.png" />Hoja de solicitud del servicio</a>
        <a href="#"><img src="https://img.icons8.com/ios-filled/50/000000/pdf.png" />Documentación y especificaciones</a>
      </div>

      <button type="submit" class="submit-btn">Guardar</button>
    </form>
  </div>

  <script>
    function increase() {
      const input = document.getElementById('cost');
      input.value = parseInt(input.value) + 1;
    }

    function decrease() {
      const input = document.getElementById('cost');
      if (parseInt(input.value) > 0) {
        input.value = parseInt(input.value) - 1;
      }
    }
  </script>

</body>
</html>
