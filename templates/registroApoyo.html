<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Apoyo - SSAC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='nuevo_servicio.css') }}" />
</head>
<body>

  <header>Sistema de Solicitud y Atención Ciudadana</header>

  <nav>
    <a href="{{ url_for('ver') }}">CIUDADANOS</a>
    <a href="{{ url_for('servicios') }}">SERVICIOS</a>
    <a href="{{ url_for('apoyos') }}" class="active">APOYOS</a>
    <a href="{{ url_for('tramites') }}">TRÁMITES</a>
  </nav>

  <div class="container">
    <h2>Nuevo Apoyo</h2>

    <form method="POST" action="{{ url_for('guardar_apoyo') }}">

      <div class="image-placeholder">
        <img src="https://via.placeholder.com/100?text=+" alt="Imagen del apoyo" />
      </div>

      <div class="form-group">
        <label>ID</label>
        <input type="text" placeholder="ID automático" disabled />
      </div>

      <div class="form-group">
        <label>Nombre del Apoyo</label>
        <input type="text" name="nombre" required />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea name="descripcion" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select name="categoria" required>
          <option value="">Seleccione...</option>
          <option value="Alimentación">Alimentación</option>
          <option value="Vivienda">Vivienda</option>
          <option value="Educación">Educación</option>
          <option value="Salud">Salud</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha de Inicio</label>
        <input type="date" name="fecha_inicio" required />
      </div>

      <div class="form-group">
        <label>Fecha de Vencimiento</label>
        <input type="date" name="fecha_vencimiento" required />
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select name="estado" required>
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Guardar</button>
    </form>
  </div>

</body>
</html>
