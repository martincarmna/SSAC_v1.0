<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Solicitud de Trámite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='solicitud.css') }}">
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; padding: 20px; }
    .form-container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-container h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #09365a; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #075082; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Registrar Solicitud de Trámite</h2>
  <form method="POST" action="{{ url_for('registrar_solicitud') }}">
    
    <div class="form-group">
      <label for="tramites_id">Trámite</label>
      <select name="tramites_id" id="tramites_id" required>
        <option value="">Seleccione un trámite</option>
        {% for tramite in tramites %}
        <option value="{{ tramite.id }}">{{ tramite.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="ciudadanos_id">Ciudadano</label>
      <select name="ciudadanos_id" id="ciudadanos_id" required>
        <option value="">Seleccione un ciudadano</option>
        {% for ciudadano in ciudadanos %}
        <option value="{{ ciudadano.id }}">{{ ciudadano.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="modalidad">Modalidad</label>
      <input type="text" name="modalidad" id="modalidad" required>
    </div>

    <div class="form-group">
      <label for="costo">Costo</label>
      <input type="number" step="0.01" name="costo" id="costo" required>
    </div>

    <div class="form-group">
      <label for="estado">Estado</label>
      <select name="estado" id="estado" required>
        <option value="">Seleccione estado</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
    </div>

    <div class="form-group">
      <label for="tipo_tramite">Tipo de Trámite</label>
      <input type="text" name="tipo_tramite" id="tipo_tramite" required>
    </div>

    <div class="form-group">
      <label for="dependencia">Dependencia</label>
      <input type="text" name="dependencia" id="dependencia" required>
    </div>

    <div class="form-group">
      <label for="vigencia">Vigencia (meses)</label>
      <input type="number" name="vigencia" id="vigencia" required>
    </div>

    <div class="form-group">
      <label for="documenti_expide">Documento que se expide</label>
      <input type="text" name="documenti_expide" id="documenti_expide" required>
    </div>

    <div class="form-group">
      <label for="formato_pago">Formato de pago</label>
      <input type="text" name="formato_pago" id="formato_pago" required>
    </div>

    <div class="form-group" style="text-align:center;">
      <button type="submit">Registrar Solicitud</button>
    </div>

  </form>
</div>

</body>
</html>
