<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Servicio - SSAC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='editar_servicio.css') }}" />
</head>
<body>

  <header>Sistema de Solicitud y Atención Ciudadana</header>

  <nav>
    <a href="{{ url_for('ver') }}">CIUDADANOS</a>
    <a href="{{ url_for('servicios') }}" class="active">SERVICIOS</a>
    <a href="{{ url_for('apoyos') }}">APOYOS</a>
    <a href="{{ url_for('tramites') }}">TRÁMITES</a>
  </nav>

  <div class="container">
    <h2>Editar Servicio</h2>

    <form method="POST" action="{{ url_for('editar_servicio', id=servicio.id) }}">

      <div class="image-placeholder">
        <img src="https://via.placeholder.com/100?text=+" alt="Imagen de servicio" />
      </div>

      <div class="form-group">
        <label>ID</label>
        <input type="text" value="{{ servicio.id }}" disabled />
      </div>

      <div class="form-group">
        <label>Nombre del servicio</label>
        <input type="text" name="nombre" value="{{ servicio.nombre }}" required />
      </div>

      <div class="form-group">
        <label>Nombre del Encargado</label>
        <input type="text" name="encargado" value="{{ servicio.encargado }}" required />
      </div>

      <div class="form-group">
       <select name="tipo_servicio" required>
          <option value="">Seleccione...</option>
          <option value="Agua Potable" {% if servicio.tipo_servicio == 'Agua Potable' %}selected{% endif %}>Agua Potable</option>
          <option value="Alumbrado Público" {% if servicio.tipo_servicio == 'Alumbrado Público' %}selected{% endif %}>Alumbrado Público</option>
          <option value="Limpia Pública" {% if servicio.tipo_servicio == 'Limpia Pública' %}selected{% endif %}>Limpia Pública</option>
        </select>
      </div>

      <div class="form-group">
        <label>Costo</label>
        <div class="cost-input">
          <button type="button" onclick="decrease()">−</button>
          <input type="number" name="costo" id="cost" value="{{ servicio.costo }}" min="0" />
          <button type="button" onclick="increase()">+</button>
        </div>
      </div>

      <div class="form-group">
          <label>Estado</label>
          <select name="estado">
            <option value="Activo" {% if servicio.estado == 'Activo' %}selected{% endif %}>Activo</option>
            <option value="Inactivo" {% if servicio.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
          </select>
      </div>

      <div class="pdf-links">
        <a href="#"><img src="https://img.icons8.com/ios-filled/50/000000/pdf.png" />Hoja de solicitud del servicio</a>
        <a href="#"><img src="https://img.icons8.com/ios-filled/50/000000/pdf.png" />Documentación y especificaciones</a>
      </div>

      <button type="submit" class="submit-btn">Guardar</button>
    </form>
  </div>

  <script>
    function increase() {
      const input = document.getElementById('cost');
      input.value = parseInt(input.value) + 1;
    }

    function decrease() {
      const input = document.getElementById('cost');
      if (parseInt(input.value) > 0) {
        input.value = parseInt(input.value) - 1;
      }
    }
  </script>

</body>
</html>
